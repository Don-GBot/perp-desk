# config.example.yaml
# Copy to config.yaml in the repo root and edit. config.yaml is git-ignored.
# Lookup order: the BOT_CONFIG env var, then <repo root>/config.yaml, then built-in defaults.
# The current working directory is never searched.
# Every value here has a default in scripts/config.py, so a missing key falls back to the
# value shown below. Percentages are written as percent (1 = 1%), not fractions.

# Where scripts read and write their files (scan.json, flags_latest.json, fundamentals.json,
# logs, state). Relative paths are relative to the repo root.
# The DATA_DIR environment variable overrides this.
data_dir: ./data

# ---------------------------------------------------------------------------
# Risk
# ---------------------------------------------------------------------------
risk:
  # Percent of live equity lost if the technical stop is hit.
  # Lower risk_per_trade_pct (and hard_cut_pct proportionally) for less risk.
  risk_per_trade_pct: 5
  # Hard-cut backstop per position: max loss at the stop, entry and exit fees included, as a
  # percent of equity at entry (wallet balance without unrealized PnL if unknown).
  # `manage.py hard-cut` tightens missing or looser stops to this level (never widens) and closes
  # any position already down this much. With protect_manual_trades it only touches bot positions.
  # Must be >= risk_per_trade_pct. Keep it a bit above to leave room for slippage.
  hard_cut_pct: 5.5
  # Slot caps, used ONLY as the fail-closed fallback when risk_caps is off or the open risk of some position
  # can't be computed: max open positions overall (manual included) and max open BOT positions per direction
  # (manual positions are not counted). Entry-only: never closes anything. If the bot positions can't be read,
  # the entry is skipped.
  max_open: 4
  max_per_direction: 3
  # risk_per_trade_pct is a MAXIMUM. true: a trade whose full-risk size doesn't fit is scaled DOWN (never up,
  # lot-rounded) to the binding limit: leverage.max, the instrument max leverage, the margin cap / free margin,
  # the highest leverage whose estimated liquidation is > 1/max_stop_to_liq x the stop distance, and the
  # risk_caps headroom. A scaled trade is skipped as fee_heavy if round-trip taker fees are more than
  # fee_heavy_max_share of its stop-out loss (only scaled trades; a full-size trade is never fee_heavy skipped),
  # or below_min_size under the instrument minimum.
  # false: the old behaviour (skip when the full size doesn't fit).
  scale_down: true
  fee_heavy_max_share: 0.3333333333333333
  # Minimum trade: skip an entry (below_min_risk, logged as a block line) whose final, fee-inclusive planned risk
  # (after any scaling) is below this percent of equity. Applies to scaled and unscaled trades; 0 turns it off.
  min_risk_pct: 1.0
  # Risk-based position caps (scripts/riskcap.py). Open risk of a position = loss if its CURRENT stop is hit,
  # from the live mark, incl. exit taker fee and slippage; 0 only if a stop-out nets >= 0 after entry + exit fees
  # and slippage. Manual position without a stop = manual_no_stop_pct of equity. Caps: all open risk + the new
  # trade <= total_pct of equity; same-direction BOT open risk + new <= direction_pct. The new trade is scaled
  # down to the headroom (skip cap_risk if it then falls below the minimum). max_positions is a hard backstop.
  # If any position's risk can't be computed (no mark, stop covering only part of the size, bot position
  # without a stop, ambiguous ownership, orders unreadable) the slot caps above apply instead (fail closed).
  risk_caps:
    enabled: true
    total_pct: 20
    direction_pct: 15
    max_positions: 8
    manual_no_stop_pct: 5
  # Re-entry cooldown: after a bot position closes at a loss by its stop-loss, trailing stop or hard cut,
  # no new entry on that pair in the same direction for this many hours from the close. The opposite
  # direction is allowed. Wins, break-even scratches (break-even already moved), manual positions and
  # manual closes don't trigger it. 0 turns it off.
  cooldown_hours: 4
  # At most one new position per executor run.
  one_new_open_per_run: true
  # Worst case: risk_caps.total_pct of equity at risk at once (20%), plus slippage beyond the buffers.

# ---------------------------------------------------------------------------
# Fees
# ---------------------------------------------------------------------------
fees:
  # Taker fee per side as a fraction (0.0006 = 0.06%). Used in the R:R check and in sizing, so a
  # clean stop-out loses about risk_per_trade_pct of equity including entry and exit fees.
  taker_rate: 0.0006
  # Slippage buffer as a fraction of entry (0.0025 = 0.25%), added to the loss at the stop in sizing and in
  # the hard cut: loss per coin = |entry - stop| + taker_rate x (entry + stop) + slip_frac x entry.
  # A buffer, not a cap: a worse stop fill can still lose more, and the hard cut cannot catch slippage
  # inside the exchange's own stop fill. Measure your own fills and adjust.
  slip_frac: 0.0025
  # Expected adverse MARKET-ENTRY fill vs the quote, fraction of entry. Added to the planned stop-out loss in
  # sizing (not in the hard cut, which uses the real average price). Default 0.18%, below the 0.25% exit buffer, as an
  # estimate until you have entry-fill data. The fee_heavy share deliberately keeps the old denominator (without this term).
  entry_slip_frac: 0.0018

# ---------------------------------------------------------------------------
# Bot identity and manual trades
# ---------------------------------------------------------------------------
bot:
  # Client order id prefix for orders this bot places (letters/digits, max 8). Used to tell
  # bot positions from manual ones.
  client_order_prefix: bfx
  # true: the hard cut, break-even and scripted closes apply only to positions the bot opened.
  #       Manual positions only get a missing-stop alert.
  # false: manual positions are managed like bot positions.
  protect_manual_trades: true
  # true: a position with no bot_positions.json record whose opening order in the exchange history carries the
  # bot prefix (filled, not reduce-only, within 120 s of the position) is adopted: manage.py rebuilds its record
  # (entry = average price, stop / target = the live TP/SL). An existing record on the pair is never overwritten.
  adopt_from_history: true

# ---------------------------------------------------------------------------
# Entry filters
# ---------------------------------------------------------------------------
entry:
  # Minimum reward:risk at the live price (ask for longs, bid for shorts), price-only:
  # (target - entry) / (entry - stop), mirrored for shorts. Fees are NOT deducted here; sizing already
  # puts fees and slippage inside risk_per_trade_pct. A net-of-fees filter blocks wide-target trades.
  min_rr: 3
  # Stop distance must be at least this many 1H ATR(14).
  min_stop_atr: 1
  # Tolerance on the ATR check at order time: allow stop >= min_stop_atr * this factor.
  # 0.95 lets a stop computed at exactly 1 ATR survive small price drift.
  atr_tolerance: 0.95
  # Trend filter: 4H EMA fast/slow. Up = fast > slow and close > slow. Down = mirror.
  # Flat pairs are skipped. Only trade with the trend.
  trend_filter:
    enabled: true
    timeframe: 4H
    ema_fast: 20
    ema_slow: 50
  # execute.py refuses scan.json older than this many minutes. Refresh the scan first.
  max_scan_age_min: 35
  # 1H trend gate (scripts/trend1h.py), checked again at order time: longs only in a 1H uptrend,
  # shorts only in a 1H downtrend, flat blocks both. Up = EMA fast > EMA slow and close > EMA slow on the
  # last `bars` closed 1H candles; down = mirror. A data error skips the setup (fails closed).
  trend_1h:
    enabled: true
    bar: 1H
    bars: 200
    ema_fast: 20
    ema_slow: 50
  # Stock-perp block (scripts/stockperp.py): no new entries on stock perps (equities, ETFs, index perps,
  # tokenized stocks). A pair is a stock perp if it is on the maintained list or Blofin reports assetClass
  # Stocks or Indices, so new listings are caught. Commodities and crypto are not blocked by this gate.
  # If the instrument metadata cannot be read for an unlisted pair, the setup is skipped (fails closed).
  # Open positions are never touched.
  stock_perp_block:
    enabled: true
  # Skip any entry (either side) on a pair that still holds an unresolved bot record: a bot_positions.json
  # record with no matching live position, or a pruned record whose close line was not found yet.
  unresolved_record_block: true
  # Hard filters, every trade (scaled or not), logged as block lines. 0 turns either off.
  # rr_cap: skip if the planned price R:R is above this.
  rr_cap_max: 8
  # cost_heavy: skip if fee_share (round-trip taker fees / stop-out loss, the fee_heavy share) is >= this.
  cost_heavy_max_share: 0.12
  # Composite setup ranking (execute.composite_score). Every setup that passes all checks is scored; the highest
  # score is tried first, then the next (one entry per run). false: scan order (best R:R first).
  # score = target + gap + cost + btc:
  #   target: -target_atr_pen per 1H ATR of |target - entry| beyond target_atr_free
  #   gap:    4H EMA fast-slow gap % (trend_filter EMAs) in the trade direction: + min(gap, gap_full_pct) / gap_full_pct;
  #           above gap_full_pct -gap_over_pen per % beyond it
  #   cost:   -fee_share_pen per percentage point of fee_share above fee_share_free
  #   btc:    +btc_bonus if the BTC-USDT 4H trend agrees with the side
  composite:
    enabled: true
    target_atr_free: 8
    target_atr_pen: 0.25
    gap_full_pct: 3
    gap_over_pen: 0.3333333333333333
    fee_share_free: 0.08
    fee_share_pen: 0.25
    btc_bonus: 0.25

# ---------------------------------------------------------------------------
# Setup scanner (scripts/scan.py)
# ---------------------------------------------------------------------------
scan:
  # Universe: live USDT perps of any asset class (nothing scheduled for delisting), top N by 24h
  # quote volume. Stock perps are then blocked by entry.stock_perp_block; commodities and forex are
  # allowed and tagged (asset_class)...
  universe_size: 25
  # Extended universe: rank by volume up to universe_ext_size. Ranks 1..universe_size are tier "core" (rules
  # unchanged); ranks universe_size+1..universe_ext_size are tier "ext" and ALSO need a fresh news-analyst rating
  # (fundamentals.json, younger than news_gate.fresh_hours) or are skipped as no_fundamentals (fails closed).
  # The rank is computed once per scan (before the spread filter) and stored in scan.json (vol_ranks,
  # vol_rank, universe_tier). false: universe_size only.
  universe_ext_enabled: true
  universe_ext_size: 40
  # ...then drop pairs whose bid/ask spread is wider than this percent of last price.
  max_spread_pct: 0.1
  # Stop = the further of (swing low/high of the last N 1H candles -/+ buffer * ATR)
  # and (entry -/+ min_stop_atr * ATR).
  swing_lookback_1h: 12
  swing_buffer_atr: 0.25
  # Target = highest high (long) / lowest low (short) of the last N 4H candles.
  target_lookback_4h: 60
  atr_period: 14
  candles_limit: 200

# ---------------------------------------------------------------------------
# Sizing, leverage, margin (scripts/execute.py)
# ---------------------------------------------------------------------------
leverage:
  # Pick the LOWEST integer leverage in [min, max] (also capped by the instrument max)
  # such that margin = notional / leverage fits under the margin cap. Skip if none fits.
  min: 3
  max: 20
  # Margin cap per new position, percent of equity. Also capped at free_margin_buffer of free margin.
  margin_cap_pct: 25
  free_margin_buffer: 0.95
  # Margin mode for new bot positions. Existing positions are always managed in their own mode.
  margin_mode: isolated
  # Default maintenance margin rate when the instrument does not report one.
  mmr_default: 0.005
  # Skip if the stop distance is >= this fraction of the estimated liquidation distance.
  # 0.5 means the liquidation price must be more than 2x further away than the stop.
  max_stop_to_liq: 0.5

# ---------------------------------------------------------------------------
# Trade management (scripts/manage.py; trailing stop placed by execute.py)
# ---------------------------------------------------------------------------
management:
  # Trailing stop placed after the fill: activates at +trail_activate_r R, callback = N x 1H ATR.
  trail_activate_r: 1.0
  trail_callback_atr: 1.5
  # Break-even: once price has moved breakeven_at_r x initial stop distance in favor, move the
  # stop to entry +/- breakeven_fee_legs x taker_rate (2 x 0.06% = 0.12%, the round-trip fees), rounded
  # to the tick in the trade's favor, so a break-even exit nets about 0. Keep the target, tighten the
  # trail to breakeven_trail_atr x ATR. Once per position.
  breakeven_at_r: 0.75
  breakeven_fee_legs: 2
  breakeven_trail_atr: 1.0

# ---------------------------------------------------------------------------
# News gate (reads DATA_DIR/fundamentals.json written by the news analyst)
# ---------------------------------------------------------------------------
news_gate:
  enabled: true
  # A rating is "fresh" for this many hours after its ts_utc (the real rating time). The ONE freshness setting:
  # the news gate, the opposing-rating block, and the ext-tier no_fundamentals check all use it.
  # (risk.cooldown_hours is separate.)
  fresh_hours: 4.5
  # Only fresh opposing ratings with one of these confidences block an entry.
  # Bearish blocks a long, bullish blocks a short. Neutral never blocks. Low is logged only.
  block_confidence:
    - medium
    - high
  # If no rating in the file is younger than this, or the file is missing, the gate fails open.
  fail_open_after_hours: 5

# ---------------------------------------------------------------------------
# Macro / event window
# ---------------------------------------------------------------------------
# No new entries from hours_before to hours_after a dated macro event (CPI, FOMC, etc.).
# Off by default: nothing in this repo feeds it yet. Turn it on only once the news analyst (or
# another source) writes dated events to fundamentals.json under macro.events.
macro_window:
  enabled: false
  hours_before: 2
  hours_after: 1

# ---------------------------------------------------------------------------
# Alerts scanner (scripts/scanner.py; the executor runs it as step 0 by default)
# ---------------------------------------------------------------------------
scanner:
  move_alert_pct: 5          # alert on |change from 24h open| >= this
  realert_min_pts: 3         # re-alert only after a further move of max(this, realert_frac x last move)
  realert_frac: 0.25
  memory_hours: 24
  coil_ratio: 0.5            # 12x1H range / median prior range below this = coil
  coil_top: 3
  flag_min_quote_vol_usd: 1000000
  flag_bar: 15m

# ---------------------------------------------------------------------------
# Logging only (never changes a stop, order or close)
# ---------------------------------------------------------------------------
logging:
  # One JSON line per gate block (news, 1h trend, stock perp) in data/blocked_setups.jsonl.
  # --dry runs write to data/logs/blocked_setups_dry.jsonl instead, so they never mix with live lines.
  blocked_setups: true
  # manage.py records funding paid per bot position (GET /api/v1/account/funding-fees, read-only).
  funding: true
  # manage.py appends one run record per invocation to data/runs.json (run_id printed in its output);
  # the agent attaches its own fields with scripts/runlog.py annotate.
  run_records: true
  # Every per-setup executor skip becomes a blocked_setups line (gate_reason from the skip reason), not only news /
  # 1h / stock-perp / sizing gates.
  log_all_skips: true
  # A --dry run whose RUN_ID names a manage.py run record (runs.json) written within this many seconds is the
  # scheduled routine's decision run: its block lines go to the LIVE log with mode "scheduled_dry". Ad-hoc dry
  # runs stay in the dry log. Logging only.
  scheduled_dry_window_s: 1800

# ---------------------------------------------------------------------------
# Ops (scripts/swapguard.py: safe file swaps / restarts while the bot is scheduled)
# ---------------------------------------------------------------------------
ops:
  # Minutes past the hour (box local time) when no swap or restart may start, around your executor schedule
  # (e.g. executor at :07 / :37 -> "05-15", "35-45"). Ranges are [start, end).
  freeze_windows: ["05-15", "35-45"]
  # Wait at most this long for running execute.py / manage.py processes and held locks, polling every
  # swap_poll_s seconds; then SKIP (exit 3). Nothing is ever killed.
  swap_timeout_s: 180
  swap_poll_s: 2
